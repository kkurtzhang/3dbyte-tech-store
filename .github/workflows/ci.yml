name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read

jobs:
  deployment-config:
    name: deployment-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without token
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge" \
              "main:refs/remotes/origin/main" \
              "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Coolify compose build stability
        run: bash .github/scripts/__tests__/coolify-compose-build-stability.test.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without token
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge" \
              "main:refs/remotes/origin/main" \
              "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Lint changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm turbo run lint --filter="...[origin/main]"
          else
            pnpm turbo run lint --filter="...[HEAD^1]"
          fi

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without token
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge" \
              "main:refs/remotes/origin/main" \
              "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Type-check changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm turbo run type-check --filter="...[origin/main]"
          else
            pnpm turbo run type-check --filter="...[HEAD^1]"
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without token
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge" \
              "main:refs/remotes/origin/main" \
              "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Test changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm turbo run test --only --filter="...[origin/main]"
          else
            pnpm turbo run test --only --filter="...[HEAD^1]"
          fi

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without token
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge" \
              "main:refs/remotes/origin/main" \
              "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright --version
      - run: pnpm exec playwright test --list

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without token
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge" \
              "main:refs/remotes/origin/main" \
              "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Secret scan (filesystem)
        continue-on-error: true
        run: gitleaks detect --source . --no-git --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high+)
        continue-on-error: true
        run: pnpm audit --audit-level=high
