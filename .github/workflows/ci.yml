name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read

env:
  CI: "true"

jobs:
  deployment-config:
    name: deployment-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployment and CI contracts
        run: |
          bash .github/scripts/__tests__/coolify-compose-build-stability.test.sh
          bash .github/scripts/__tests__/ci-quality-contract.test.sh
          node --test .github/scripts/__tests__/staging-audit-exception.test.mjs
          node --experimental-test-coverage --test .github/scripts/__tests__/coolify*.test.mjs
          bash .github/scripts/__tests__/wait-for-staging-release.test.sh
          bash .github/scripts/__tests__/decide-ai-assistant-eval.test.sh
          bash .github/scripts/__tests__/search-ownership-contract.test.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint active storefront
        run: pnpm --filter=@3dbyte-tech-store/storefront-v3 lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Type-check shared TypeScript packages
        run: |
          pnpm --filter=@3dbyte-tech-store/observability type-check
          pnpm --filter=@3dbyte-tech-store/shared-types type-check
          pnpm --filter=@3dbyte-tech-store/shared-utils type-check

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      consent-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55489:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      consent-redis:
        image: redis:8.4
        ports:
          - 127.0.0.1:6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test installed dependency security regressions
        run: pnpm test:dependency-security
      - name: Test local knowledge schema compatibility
        run: >-
          pnpm --filter=@3dbyte-tech-store/storefront-v3 exec jest --runInBand --env=node
          --testMatch '**/scripts/__tests__/local-knowledge.test.ts'
          '**/scripts/__tests__/local-knowledge-catalogue100-focus.test.ts'
      - name: Test storefront custom behavior
        run: pnpm --filter=@3dbyte-tech-store/storefront-v3 test:ci
      - name: Test Medusa custom modules and routes
        env:
          CONSENT_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:55489/postgres
          CONSENT_TEST_REDIS_URL: redis://127.0.0.1:6399
          REDIS_URL: redis://127.0.0.1:6399
        run: pnpm --filter=@3dbyte-tech-store/backend test:unit
      - name: Test shared runtime packages
        run: |
          pnpm --filter=@3dbyte-tech-store/observability test
          pnpm --filter=@3dbyte-tech-store/shared-utils test

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci
      JWT_SECRET: ci-fixture-jwt-value-0000000000000000
      COOKIE_SECRET: ci-fixture-cookie-value-0000000000000
      AUTH_MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-with-32-characters
      STORE_CORS: http://localhost:3001
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3001,http://localhost:9000
      APP_KEYS: ci-app-key-one,ci-app-key-two
      API_TOKEN_SALT: ci-api-token-salt
      ADMIN_JWT_SECRET: ci-admin-jwt-secret
      TRANSFER_TOKEN_SALT: ci-transfer-token-salt
      ENCRYPTION_KEY: ci-encryption-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.staging.3dbytetech.com.au
      MEDUSA_SERVER_BACKEND_URL: https://api.staging.3dbytetech.com.au
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ci-publishable-placeholder
      NEXT_PUBLIC_STRAPI_URL: https://cms.staging.3dbytetech.com.au
      NEXT_PUBLIC_MEILISEARCH_HOST: https://search.3dbytetech.com.au
      NEXT_PUBLIC_MEILISEARCH_API_KEY: ci-search-placeholder
      NEXT_PUBLIC_MEILISEARCH_INDEX_NAME: stg_products
      NEXT_PUBLIC_MEILISEARCH_PRODUCT_INDEX_NAME: stg_products
      NEXT_PUBLIC_MEILISEARCH_CATEGORY_INDEX_NAME: stg_categories
      NEXT_PUBLIC_MEILISEARCH_BRAND_INDEX_NAME: stg_brands
      ORDER_ACCESS_TOKEN_SECRET: ci-only-order-access-secret-with-32-characters
      REDIS_URL: redis://localhost:6379/2
      TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build Medusa
        run: pnpm --filter=@3dbyte-tech-store/backend build
      - name: Build Strapi Admin and server
        run: pnpm --filter=@3dbyte-tech-store/cms build
      - name: Build storefront
        run: pnpm --filter=@3dbyte-tech-store/storefront-v3 build

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.staging.3dbytetech.com.au
      MEDUSA_SERVER_BACKEND_URL: https://api.staging.3dbytetech.com.au
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ci-publishable-placeholder
      NEXT_PUBLIC_STRAPI_URL: https://cms.staging.3dbytetech.com.au
      NEXT_PUBLIC_MEILISEARCH_HOST: https://search.3dbytetech.com.au
      NEXT_PUBLIC_MEILISEARCH_API_KEY: ci-search-placeholder
      NEXT_PUBLIC_MEILISEARCH_INDEX_NAME: stg_products
      NEXT_PUBLIC_MEILISEARCH_PRODUCT_INDEX_NAME: stg_products
      NEXT_PUBLIC_MEILISEARCH_CATEGORY_INDEX_NAME: stg_categories
      NEXT_PUBLIC_MEILISEARCH_BRAND_INDEX_NAME: stg_brands
      ORDER_ACCESS_TOKEN_SECRET: ci-only-order-access-secret-with-32-characters
      REDIS_URL: redis://localhost:6379/2
      TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test AI draft Admin pagination with synthetic data
        run: pnpm exec playwright test --config apps/backend/integration-tests/admin/playwright.config.cjs
      - name: Test support notification reconciliation with synthetic data
        run: pnpm exec playwright test --config apps/backend/integration-tests/admin/delivery.playwright.config.cjs
      - name: Run browser smoke against the PR storefront
        run: pnpm exec playwright test tests/e2e/homepage.spec.ts tests/e2e/assistant-product-actions.spec.ts tests/e2e/assistant-combined-consent.spec.ts

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          sudo install -m 0755 "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
      - name: Block credentials in the checked-out tree
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Block high and critical dependency advisories
        run: node .github/scripts/staging-audit-exception.mjs -- pnpm audit --audit-level=high
      - name: Verify dependency audit restored the checkout
        if: always()
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
