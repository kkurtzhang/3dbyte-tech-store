name: ai-assistant-evals

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Storefront base URL to evaluate.
        required: true
        default: https://store.staging.3dbytetech.com.au
        type: string
      cases:
        description: Optional comma-separated eval case ids.
        required: false
        default: ""
        type: string
      limit:
        description: Optional max number of eval cases.
        required: false
        default: ""
        type: string
      attempts:
        description: Complete suite attempts to run.
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "1"
  push:
    branches: [staging]
    paths:
      - .github/workflows/ai-assistant-evals.yml
      - .github/scripts/decide-ai-assistant-eval.sh
      - .github/scripts/wait-for-staging-release.sh
      - .github/scripts/__tests__/decide-ai-assistant-eval.test.sh
      - .github/scripts/__tests__/ai-assistant-evals-workflow.test.sh
      - .github/scripts/__tests__/coolify-release-sha-env.test.sh
      - .github/scripts/__tests__/wait-for-staging-release.test.sh
      - apps/storefront-v3/scripts/run-customer-ai-evals.ts
      - apps/storefront-v3/src/app/api/ai-shopping-assistant/**
      - docs/ai-engineer-pathway/phase-3-operational-feedback.md

permissions:
  contents: read
  id-token: write

jobs:
  customer-smoke:
    name: customer-smoke
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout source and parent without token
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --prune --depth=2 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Test live eval decision
        run: |
          set -euo pipefail
          for test_script in .github/scripts/__tests__/*.test.sh; do
            bash "${test_script}"
          done

      - name: Decide whether live eval can run before deploy
        id: live-eval
        env:
          AI_ASSISTANT_EVAL_WORKFLOW_ATTEMPTS: ${{ inputs.attempts || '3' }}
        run: bash .github/scripts/decide-ai-assistant-eval.sh

      - name: Note skipped live eval
        if: steps.live-eval.outputs.should_run != 'true'
        run: |
          echo "Skipping live staging assistant eval: ${{ steps.live-eval.outputs.reason }}"

      - name: Wait for staging deployment
        if: steps.live-eval.outputs.should_run == 'true' && steps.live-eval.outputs.wait_for_release == 'true'
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          POLL_SECONDS: "15"
          STAGING_HEALTH_URL: ${{ inputs.base_url || 'https://store.staging.3dbytetech.com.au' }}/api/health
          TIMEOUT_SECONDS: "1200"
        run: bash .github/scripts/wait-for-staging-release.sh

      - uses: actions/setup-node@v6
        if: steps.live-eval.outputs.should_run == 'true'
        with:
          node-version: 20

      - name: Enable pnpm
        if: steps.live-eval.outputs.should_run == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - run: pnpm install --frozen-lockfile
        if: steps.live-eval.outputs.should_run == 'true'

      - name: Connect to private observability network
        if: steps.live-eval.outputs.should_run == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ai-eval
          version: latest
          ping: 100.68.121.61

      - name: Check Langfuse access
        if: steps.live-eval.outputs.should_run == 'true'
        env:
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          : "${LANGFUSE_HOST:?LANGFUSE_HOST is required}"
          : "${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY is required}"
          : "${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY is required}"
          curl -fsS "${LANGFUSE_HOST%/}/api/public/health" >/dev/null
          curl -fsS \
            -u "${LANGFUSE_PUBLIC_KEY}:${LANGFUSE_SECRET_KEY}" \
            "${LANGFUSE_HOST%/}/api/public/projects" >/dev/null

      - name: Run customer AI evals
        if: steps.live-eval.outputs.should_run == 'true'
        env:
          AI_ASSISTANT_EVAL_ATTEMPTS: ${{ steps.live-eval.outputs.attempts }}
          AI_ASSISTANT_EVAL_BASE_URL: ${{ inputs.base_url || 'https://store.staging.3dbytetech.com.au' }}
          AI_ASSISTANT_EVAL_CASES: ${{ inputs.cases || '' }}
          AI_ASSISTANT_EVAL_LIMIT: ${{ inputs.limit || '' }}
          AI_ASSISTANT_EVAL_SUITE: smoke
          AI_ASSISTANT_EVAL_UPLOAD_LANGFUSE: "true"
          AI_ASSISTANT_EVAL_OUTPUT: json
          AI_ASSISTANT_EVAL_OUTPUT_FILE: ${{ github.workspace }}/artifacts/customer-ai-evals.json
          LANGFUSE_EVAL_ENVIRONMENT: staging
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm --filter=@3dbyte-tech-store/storefront-v3 eval:ai:customer \
            | tee artifacts/customer-ai-evals.stdout.log

      - name: Upload eval report
        if: always() && steps.live-eval.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: customer-ai-evals-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
