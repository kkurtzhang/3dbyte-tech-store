name: ai-assistant-evals

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Storefront base URL to evaluate.
        required: true
        default: https://store.staging.3dbytetech.com.au
        type: string
      cases:
        description: Optional comma-separated eval case ids.
        required: false
        default: ""
        type: string
      limit:
        description: Optional max number of eval cases.
        required: false
        default: ""
        type: string
  push:
    branches: [staging]
    paths:
      - .github/workflows/ai-assistant-evals.yml
      - apps/storefront-v3/scripts/run-customer-ai-evals.ts
      - apps/storefront-v3/src/app/api/ai-shopping-assistant/**
      - docs/ai-engineer-pathway/phase-3-operational-feedback.md

permissions:
  contents: read

jobs:
  customer-smoke:
    name: customer-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether live eval can run before deploy
        id: live-eval
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          runtime_paths = {
              "apps/storefront-v3/src/app/api/ai-shopping-assistant/route.ts",
              "apps/storefront-v3/src/app/api/ai-shopping-assistant/prompt-management.ts",
          }

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)

          head_commit = event.get("head_commit") or {}
          changed = set()
          for key in ("added", "modified", "removed"):
              changed.update(head_commit.get(key) or [])

          runtime_changed = sorted(changed.intersection(runtime_paths))

          if runtime_changed:
              print("should_run=false")
              print(
                  "reason=assistant runtime changed; run workflow_dispatch after Coolify deploy"
              )
          else:
              print("should_run=true")
              print("reason=eval-only or docs/workflow change")
          PY

      - name: Note skipped live eval
        if: steps.live-eval.outputs.should_run != 'true'
        run: |
          echo "Skipping live staging assistant eval: ${{ steps.live-eval.outputs.reason }}"

      - name: Checkout without token
        if: steps.live-eval.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - uses: actions/setup-node@v6
        if: steps.live-eval.outputs.should_run == 'true'
        with:
          node-version: 20

      - name: Enable pnpm
        if: steps.live-eval.outputs.should_run == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - run: pnpm install --frozen-lockfile
        if: steps.live-eval.outputs.should_run == 'true'

      - name: Run customer AI evals
        if: steps.live-eval.outputs.should_run == 'true'
        env:
          AI_ASSISTANT_EVAL_BASE_URL: ${{ inputs.base_url || 'https://store.staging.3dbytetech.com.au' }}
          AI_ASSISTANT_EVAL_CASES: ${{ inputs.cases || '' }}
          AI_ASSISTANT_EVAL_LIMIT: ${{ inputs.limit || '' }}
          AI_ASSISTANT_EVAL_SUITE: smoke
          AI_ASSISTANT_EVAL_OUTPUT: json
          AI_ASSISTANT_EVAL_OUTPUT_FILE: ${{ github.workspace }}/artifacts/customer-ai-evals.json
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm --filter=@3dbyte-tech-store/storefront-v3 eval:ai:customer \
            | tee artifacts/customer-ai-evals.stdout.log

      - name: Upload eval report
        if: always() && steps.live-eval.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: customer-ai-evals-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
