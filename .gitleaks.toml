title = "3D Byte Tech Store Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore the scanner configuration itself"
paths = ['''^\.gitleaks\.toml$''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Allow explicit bearer-token placeholders in CMS documentation"
  condition = "AND"
  regexTarget = "match"
  paths = ['''^apps/cms/docs/(?:02-media-management|03-api-integrations)\.md$''']
  regexes = ['''Authorization: Bearer YOUR_(?:JWT_TOKEN|API_TOKEN|TOKEN)''']

# Approved 2026-10-14: 53 inspected non-secret catalogue/source identifiers.
# Each entry requires the exact file AND the exact full scanner match.
# See scripts/security/fixtures/gitleaks-approved-identifiers.json and
# scripts/security/test_gitleaks_exceptions.py for scope and negative controls.
