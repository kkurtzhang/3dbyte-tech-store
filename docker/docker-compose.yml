services:
  # Strapi CMS
  cms:
    container_name: 3dbyte-cms
    build:
      context: ..
      dockerfile: docker/cms/Dockerfile
    image: 3dbyte-cms:latest
    restart: unless-stopped
    env_file:
      - ../apps/cms/.env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meilisearch:7700
    volumes:
      - ../apps/cms/config:/opt/apps/cms/config
      - ../apps/cms/src:/opt/apps/cms/src
      - ../apps/cms/package.json:/opt/apps/cms/package.json
      - ../apps/cms/.env:/opt/apps/cms/.env
      - ../apps/cms/public/uploads:/opt/apps/cms/public/uploads
    ports:
      - "1337:1337"
    networks:
      - 3dbyte-network
    depends_on:
      - redis
      - meilisearch

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.31.0
    container_name: 3dbyte-meilisearch
    command: meilisearch
    environment:
      MEILI_MASTER_KEY: IZKjKX6kXKnH0d4VgL0LrBgSccbImu4PkvDOvL81dww
      MEILI_ENV: development
    volumes:
      - ../apps/cms/docker_volumes/meili_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - 3dbyte-network

  # Redis
  redis:
    image: redis:8.4.0
    container_name: 3dbyte-redis
    ports:
      - "6379:6379"
    volumes:
      - ../apps/cms/docker_volumes/redis_data:/data
    networks:
      - 3dbyte-network

  # Karrio Shipping - API Server (uses same external PostgreSQL as Medusa/Strapi)
  karrio-api:
    image: karrio/server:2024.6
    container_name: 3dbyte-karrio-api
    restart: unless-stopped
    environment:
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: ${KARRIO_DATABASE_NAME:-karrio}
      DATABASE_USERNAME: ${KARRIO_DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${KARRIO_DATABASE_PASSWORD:-password}
      DATABASE_HOST: ${KARRIO_DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${KARRIO_DATABASE_PORT:-5432}
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${KARRIO_SECRET_KEY:-changeme-generate-a-secret-key}
      KARRIO_PUBLIC_URL: ${KARRIO_PUBLIC_URL:-http://localhost:5002}
      ALLOW_SIGNUP: "False"
    ports:
      - "5002:5002"
    networks:
      - 3dbyte-network
    depends_on:
      - redis

  # Karrio Shipping - Worker
  karrio-worker:
    image: karrio/server:2024.6
    container_name: 3dbyte-karrio-worker
    restart: unless-stopped
    command: "/bin/bash -c '/usr/local/bin/karrio worker'"
    environment:
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: ${KARRIO_DATABASE_NAME:-karrio}
      DATABASE_USERNAME: ${KARRIO_DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${KARRIO_DATABASE_PASSWORD:-password}
      DATABASE_HOST: ${KARRIO_DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${KARRIO_DATABASE_PORT:-5432}
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${KARRIO_SECRET_KEY:-changeme-generate-a-secret-key}
      KARRIO_PUBLIC_URL: ${KARRIO_PUBLIC_URL:-http://localhost:5002}
    networks:
      - 3dbyte-network
    depends_on:
      - karrio-api

  # Karrio Shipping - Dashboard
  karrio-dashboard:
    image: karrio/dashboard:2024.6
    container_name: 3dbyte-karrio-dashboard
    restart: unless-stopped
    environment:
      KARRIO_PUBLIC_URL: ${KARRIO_PUBLIC_URL:-http://localhost:5002}
      DASHBOARD_URL: ${KARRIO_DASHBOARD_URL:-http://localhost:3002}
    ports:
      - "3002:3000"
    networks:
      - 3dbyte-network
    depends_on:
      - karrio-api

networks:
  3dbyte-network:
    name: 3dbyte-network
    driver: bridge
